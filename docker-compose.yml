version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financesim-backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - ./backend/app/data/fallback:/app/app/data/fallback:ro
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/data/finance_sim.db
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - financesim-net

  # 可选：前端开发服务器（仅开发环境）
  frontend-dev:
    image: node:20-alpine
    container_name: financesim-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - financesim-net
    restart: unless-stopped

networks:
  financesim-net:
    driver: bridge

volumes:
  db_data:
    driver: local
